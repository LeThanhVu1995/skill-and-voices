<!DOCTYPE html>
<html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nhận diện cảm xúc</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:system-ui,sans-serif;background:linear-gradient(135deg,#fdf2f8,#fff9f2);min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:20px;color:#1e293b}
h1{color:#db2777;font-size:1.5rem;margin-bottom:4px;text-align:center}
.sub{color:#64748b;font-size:.9rem;margin-bottom:16px;text-align:center;max-width:460px}
.card{background:#fff;border-radius:20px;padding:24px;box-shadow:0 10px 30px rgba(219,39,119,.12);width:100%;max-width:440px;text-align:center}
.face{font-size:5rem;margin:6px 0}
.lbl{color:#9d174d;font-weight:700;margin-bottom:16px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.opt{border:2px solid #fbcfe8;border-radius:16px;padding:14px;font-weight:700;cursor:pointer;background:#fdf2f8;transition:.15s}
.opt:hover{transform:translateY(-3px);border-color:#ec4899}
.opt.ok{background:#dcfce7;border-color:#22c55e}.opt.no{background:#fee2e2;border-color:#ef4444}
.score{margin-top:14px;color:#db2777;font-weight:600}
.btn{margin-top:14px;background:linear-gradient(120deg,#ec4899,#be185d);color:#fff;border:none;padding:12px 28px;border-radius:14px;font-weight:700;cursor:pointer}
.fb{margin-top:10px;font-weight:600;min-height:22px}
</style></head><body>
<h1>😊 Nhận diện cảm xúc</h1>
<p class="sub">AI có thể đọc cảm xúc qua khuôn mặt. Em đoán xem khuôn mặt này đang cảm thấy thế nào nhé!</p>
<div class="card" id="card"></div>
<script>
const E=[
{f:"😄",a:"Vui",t:"Bạn vui khi được khen hoặc chơi cùng bạn bè."},
{f:"😢",a:"Buồn",t:"Khi buồn, hãy chia sẻ với bố mẹ nhé."},
{f:"😡",a:"Tức giận",t:"Hít thở sâu khi tức giận sẽ giúp em bình tĩnh."},
{f:"😱",a:"Sợ hãi",t:"Sợ là bình thường, em rất dũng cảm!"},
{f:"😍",a:"Thích thú",t:"Khi thích điều gì, mắt ta sáng lên!"},
{f:"😴",a:"Buồn ngủ",t:"Ngủ đủ giấc giúp em học giỏi hơn."},
{f:"😮",a:"Ngạc nhiên",t:"Bất ngờ làm ta mở to mắt!"},
{f:"😊",a:"Vui",t:"Nụ cười khiến mọi người quý mến em hơn."},
];
const ALL=["Vui","Buồn","Tức giận","Sợ hãi","Thích thú","Buồn ngủ","Ngạc nhiên"];
let i=0,s=0,done=false;
function shuffle(a){for(let k=a.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[a[k],a[j]]=[a[j],a[k]]}return a}
shuffle(E);
function render(){
const c=document.getElementById('card');
if(i>=E.length){c.innerHTML=`<div class="face">🎉</div><div class="lbl">Hoàn thành!</div><p class="score">Đúng ${s}/${E.length}</p><button class="btn" onclick="restart()">Chơi lại</button>`;return}
done=false;const e=E[i];
let opts=[e.a];while(opts.length<4){const r=ALL[Math.floor(Math.random()*ALL.length)];if(!opts.includes(r))opts.push(r)}
shuffle(opts);
c.innerHTML=`<p style="color:#94a3b8;font-size:.85rem">Câu ${i+1}/${E.length}</p><div class="face">${e.f}</div><div class="lbl">Cảm xúc gì đây?</div>
<div class="opts">${opts.map(o=>`<div class="opt" onclick="pick('${o}',this)">${o}</div>`).join("")}</div>
<p class="fb" id="fb"></p><p class="score">Điểm: ${s}</p>`;
}
function pick(o,el){
if(done)return;done=true;const e=E[i];const ok=o===e.a;el.classList.add(ok?'ok':'no');if(ok)s++;
if(!ok)document.querySelectorAll('.opt').forEach(b=>{if(b.textContent===e.a)b.classList.add('ok')});
document.getElementById('fb').innerHTML=(ok?'<span style="color:#16a34a">🎯 ':'<span style="color:#dc2626">💡 ')+e.t+'</span>';
setTimeout(()=>{i++;render()},1500);
}
function restart(){i=0;s=0;shuffle(E);render()}
render();
</script></body></html>
