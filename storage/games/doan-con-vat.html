<!DOCTYPE html>
<html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI đoán con vật</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:system-ui,sans-serif;background:linear-gradient(135deg,#f0fdf4,#fff9f2);min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:20px;color:#1e293b}
h1{color:#15803d;font-size:1.5rem;margin-bottom:4px;text-align:center}
.sub{color:#64748b;font-size:.9rem;margin-bottom:16px;text-align:center;max-width:460px}
.card{background:#fff;border-radius:20px;padding:24px;box-shadow:0 10px 30px rgba(21,128,61,.12);width:100%;max-width:440px;text-align:center}
.clue{background:#f0fdf4;border-left:4px solid #22c55e;border-radius:10px;padding:10px 14px;margin:8px 0;text-align:left;color:#166534;font-weight:600;animation:fade .3s}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1}}
.opts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px}
.opt{font-size:2.2rem;border:2px solid #bbf7d0;border-radius:16px;padding:12px;cursor:pointer;background:#f0fdf4;transition:.15s}
.opt:hover{transform:translateY(-3px);border-color:#22c55e}
.opt.ok{background:#dcfce7;border-color:#22c55e}.opt.no{background:#fee2e2;border-color:#ef4444}
.lbl{color:#15803d;font-weight:700;margin-top:14px}
.fb{margin-top:10px;font-weight:600;min-height:22px}
.score{margin-top:10px;color:#15803d;font-weight:600}
.btn{margin-top:14px;background:linear-gradient(120deg,#22c55e,#15803d);color:#fff;border:none;padding:10px 22px;border-radius:12px;font-weight:700;cursor:pointer}
</style></head><body>
<h1>🔍 AI đoán con vật</h1>
<p class="sub">AI đoán dựa vào manh mối. Em đọc gợi ý rồi chọn đúng con vật nhé! Bấm "Thêm gợi ý" nếu cần.</p>
<div class="card" id="card"></div>
<script>
const A=[
{e:"🐘",clues:["Tôi là động vật rất to lớn.","Tôi có cái vòi dài.","Tôi có đôi tai to và ngà trắng."],opt:["🐘","🦒","🦏"]},
{e:"🐧",clues:["Tôi sống ở nơi rất lạnh.","Tôi biết bơi nhưng không bay.","Tôi mặc 'áo' đen trắng."],opt:["🦆","🐧","🐦"]},
{e:"🦁",clues:["Tôi sống ở đồng cỏ châu Phi.","Tôi được gọi là chúa sơn lâm.","Con đực của tôi có bờm."],opt:["🐯","🐆","🦁"]},
{e:"🐢",clues:["Tôi di chuyển rất chậm.","Tôi mang nhà trên lưng.","Tôi sống rất thọ."],opt:["🐌","🐢","🦎"]},
{e:"🐝",clues:["Tôi là côn trùng nhỏ bé.","Tôi hút mật hoa.","Tôi làm ra mật ngọt."],opt:["🦋","🐝","🐞"]},
{e:"🦉",clues:["Tôi thường thức vào ban đêm.","Tôi có đôi mắt to tròn.","Tôi quay đầu được rất xa."],opt:["🦅","🦉","🦜"]},
];
let i=0,s=0,shown,done=false;
function shuffle(a){for(let k=a.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[a[k],a[j]]=[a[j],a[k]]}return a}
shuffle(A);
function render(){
const c=document.getElementById('card');
if(i>=A.length){c.innerHTML=`<div style="font-size:2.4rem">🎉</div><div class="lbl">Hoàn thành!</div><p class="score">Đúng ${s}/${A.length}</p><button class="btn" onclick="restart()">Chơi lại</button>`;return}
done=false;shown=1;const a=A[i];const opts=shuffle([...a.opt]);
c.innerHTML=`<p style="color:#94a3b8;font-size:.85rem">Con vật ${i+1}/${A.length}</p>
<div id="clues">${a.clues.slice(0,1).map(x=>`<div class="clue">💡 ${x}</div>`).join('')}</div>
<button class="btn" style="background:#dcfce7;color:#15803d" onclick="more()">+ Thêm gợi ý</button>
<div class="lbl">Đó là con gì?</div>
<div class="opts">${opts.map(o=>`<button class="opt" onclick="pick('${o}',this)">${o}</button>`).join('')}</div>
<p class="fb" id="fb"></p><p class="score">Điểm: ${s}</p>`;
}
function more(){const a=A[i];if(shown<a.clues.length){document.getElementById('clues').innerHTML+=`<div class="clue">💡 ${a.clues[shown]}</div>`;shown++}}
function pick(o,el){
if(done)return;done=true;const ok=o===A[i].e;el.classList.add(ok?'ok':'no');if(ok)s++;
if(!ok)document.querySelectorAll('.opt').forEach(b=>{if(b.textContent===A[i].e)b.classList.add('ok')});
document.getElementById('fb').innerHTML=ok?'<span style="color:#16a34a">🎯 Chính xác!</span>':'<span style="color:#dc2626">💡 Đáp án đúng đã hiện!</span>';
setTimeout(()=>{i++;render()},1300);
}
function restart(){i=0;s=0;shuffle(A);render()}
render();
</script></body></html>
