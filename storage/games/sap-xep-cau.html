<!DOCTYPE html>
<html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sắp xếp câu cùng AI</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:system-ui,sans-serif;background:linear-gradient(135deg,#f0fdfa,#fff9f2);min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:20px;color:#1e293b}
h1{color:#0d9488;font-size:1.5rem;margin-bottom:4px;text-align:center}
.sub{color:#64748b;font-size:.9rem;margin-bottom:14px;text-align:center;max-width:460px}
.card{background:#fff;border-radius:20px;padding:22px;box-shadow:0 10px 30px rgba(13,148,136,.12);width:100%;max-width:460px}
.hint{color:#0f766e;font-weight:700;text-align:center;margin-bottom:14px}
.build{min-height:56px;display:flex;flex-wrap:wrap;gap:8px;background:#f0fdfa;border:2px dashed #99f6e4;border-radius:14px;padding:10px;margin-bottom:14px}
.bank{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.w{border:none;border-radius:10px;padding:9px 14px;font-size:1rem;font-weight:600;cursor:pointer;background:#ccfbf1;color:#0f766e}
.w:active{transform:scale(.95)}
.build .w{background:#0d9488;color:#fff}
.row{display:flex;gap:8px;margin-top:14px}
.btn{flex:1;border:none;border-radius:12px;padding:12px;font-weight:700;cursor:pointer}
.chk{background:linear-gradient(120deg,#14b8a6,#0f766e);color:#fff}
.clr{background:#e2e8f0;color:#475569}
.fb{text-align:center;margin-top:12px;font-weight:700;min-height:24px}
.score{text-align:center;margin-top:8px;color:#0d9488;font-weight:600}
</style></head><body>
<h1>📝 Sắp xếp câu cùng AI</h1>
<p class="sub">AI hiểu câu khi các từ đúng thứ tự. Em hãy bấm các từ để xếp thành câu có nghĩa nhé!</p>
<div class="card" id="card"></div>
<script>
const S=[
"Em chào cô giáo ạ",
"Hôm nay trời nắng đẹp",
"Con yêu bố mẹ rất nhiều",
"Em thích học môn Tiếng Việt",
"Bạn nhỏ tự tin thuyết trình",
"Chúng em chăm chỉ học bài",
];
let i=0,s=0,bank=[],build=[];
function shuffle(a){for(let k=a.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[a[k],a[j]]=[a[j],a[k]]}return a}
function load(){
if(i>=S.length){document.getElementById('card').innerHTML=`<div class="hint" style="font-size:1.3rem">🎉 Hoàn thành!</div><p class="score">Đúng ${s}/${S.length} câu</p><div class="row"><button class="btn chk" onclick="restart()">Chơi lại</button></div>`;return}
build=[];bank=shuffle(S[i].split(" ").map((w,idx)=>({w,id:idx})));render();
}
function render(){
document.getElementById('card').innerHTML=`<p style="color:#94a3b8;font-size:.85rem;text-align:center">Câu ${i+1}/${S.length}</p>
<div class="hint">Xếp các từ thành câu đúng</div>
<div class="build" id="b">${build.length?build.map((t,x)=>`<button class="w" onclick="back(${x})">${t.w}</button>`).join(''):'<span style="color:#94a3b8;font-size:.85rem">Bấm từ bên dưới...</span>'}</div>
<div class="bank">${bank.map((t,x)=>`<button class="w" onclick="take(${x})">${t.w}</button>`).join('')}</div>
<div class="row"><button class="btn chk" onclick="check()">✓ Kiểm tra</button><button class="btn clr" onclick="load()">↺ Làm lại</button></div>
<p class="fb" id="fb"></p><p class="score">Điểm: ${s}</p>`;
}
function take(x){build.push(bank[x]);bank.splice(x,1);render()}
function back(x){bank.push(build[x]);build.splice(x,1);render()}
function check(){
const made=build.map(t=>t.w).join(" ");
const fb=document.getElementById('fb');
if(made===S[i]){s++;fb.innerHTML='<span style="color:#0d9488">🎯 Chính xác! Câu rất hay!</span>';setTimeout(()=>{i++;load()},1200)}
else{fb.innerHTML='<span style="color:#dc2626">💡 Chưa đúng thứ tự, thử lại nhé!</span>'}
}
function restart(){i=0;s=0;load()}
load();
</script></body></html>
