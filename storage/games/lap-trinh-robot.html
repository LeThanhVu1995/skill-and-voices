<!DOCTYPE html>
<html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lập trình Robot</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:system-ui,sans-serif;background:linear-gradient(135deg,#eef2ff,#fff9f2);min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:18px;color:#1e293b}
h1{color:#4f46e5;font-size:1.5rem;margin-bottom:4px;text-align:center}
.sub{color:#64748b;font-size:.88rem;margin-bottom:12px;text-align:center;max-width:460px}
.card{background:#fff;border-radius:20px;padding:18px;box-shadow:0 10px 30px rgba(79,70,229,.12);width:100%;max-width:440px}
.grid{display:grid;gap:4px;margin:0 auto 14px;width:fit-content;background:#e0e7ff;padding:6px;border-radius:14px}
.cell{width:52px;height:52px;border-radius:10px;background:#f8faff;display:flex;align-items:center;justify-content:center;font-size:1.7rem}
.cell.goal{background:#fef9c3}
.queue{min-height:48px;display:flex;flex-wrap:wrap;gap:6px;background:#f8faff;border:2px dashed #c7d2fe;border-radius:12px;padding:8px;margin-bottom:12px}
.tok{background:#4f46e5;color:#fff;border-radius:8px;padding:6px 10px;font-weight:700}
.pad{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:10px}
.cmd{border:none;border-radius:12px;padding:12px;font-size:1.3rem;font-weight:700;cursor:pointer;background:#eef2ff;color:#4f46e5}
.cmd:active{transform:scale(.94)}
.row{display:flex;gap:8px}
.btn{flex:1;border:none;border-radius:12px;padding:12px;font-weight:700;cursor:pointer}
.run{background:linear-gradient(120deg,#6366f1,#4338ca);color:#fff}
.clr{background:#e2e8f0;color:#475569}
.fb{text-align:center;margin-top:10px;font-weight:700;min-height:24px}
</style></head><body>
<h1>🤖 Lập trình Robot</h1>
<p class="sub">Xếp các lệnh để robot 🤖 đi tới ngôi sao ⭐. Đây là cách AI làm theo thuật toán!</p>
<div class="card">
<div class="grid" id="grid"></div>
<div class="queue" id="queue"></div>
<div class="pad">
<button class="cmd" onclick="add('U')">⬆️</button>
<button class="cmd" onclick="add('D')">⬇️</button>
<button class="cmd" onclick="add('L')">⬅️</button>
<button class="cmd" onclick="add('R')">➡️</button>
</div>
<div class="row"><button class="btn run" onclick="run()">▶ Chạy</button><button class="btn clr" onclick="reset()">🗑 Xóa</button></div>
<div class="fb" id="fb"></div>
</div>
<script>
const N=5;let level=0;
const levels=[{start:[0,0],goal:[2,2]},{start:[0,0],goal:[4,3]},{start:[4,0],goal:[0,4]}];
let pos,queue,goal;
function load(){const L=levels[level%levels.length];pos=[...L.start];goal=[...L.goal];queue=[];document.getElementById('fb').textContent='';draw()}
function draw(robot){
const g=document.getElementById('grid');g.style.gridTemplateColumns=`repeat(${N},52px)`;
let h='';
for(let r=0;r<N;r++)for(let c=0;c<N;c++){
const isR=(robot?robot[0]:pos[0])===r&&(robot?robot[1]:pos[1])===c;
const isG=goal[0]===r&&goal[1]===c;
h+=`<div class="cell ${isG?'goal':''}">${isR?'🤖':isG?'⭐':''}</div>`;
}
g.innerHTML=h;
document.getElementById('queue').innerHTML=queue.length?queue.map(q=>`<span class="tok">${{U:'⬆️',D:'⬇️',L:'⬅️',R:'➡️'}[q]}</span>`).join(''):'<span style="color:#94a3b8;font-size:.85rem">Thêm lệnh ở dưới...</span>';
}
function add(d){if(queue.length<12){queue.push(d);draw()}}
function reset(){queue=[];load()}
function run(){
let r=pos[0],c=pos[1],step=0;
const tick=()=>{
if(step>=queue.length){
if(r===goal[0]&&c===goal[1]){document.getElementById('fb').innerHTML='<span style="color:#16a34a">🎉 Robot tới đích! Giỏi quá!</span>';setTimeout(()=>{level++;load()},1500);}
else{document.getElementById('fb').innerHTML='<span style="color:#dc2626">Chưa tới đích, thử lại nhé!</span>';setTimeout(()=>{queue=[];load()},1200)}
return;}
const d=queue[step++];
if(d==='U')r=Math.max(0,r-1);if(d==='D')r=Math.min(N-1,r+1);if(d==='L')c=Math.max(0,c-1);if(d==='R')c=Math.min(N-1,c+1);
draw([r,c]);setTimeout(tick,350);
};tick();
}
load();
</script></body></html>
