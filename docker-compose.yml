services:
  postgres:
    image: postgres:16-alpine
    container_name: duyen_voice_skill_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: duyen_voice_skill
      TZ: Asia/Ho_Chi_Minh
    ports:
      - "5432:5432"
    volumes:
      - duyen_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d duyen_voice_skill"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  duyen_pgdata:
